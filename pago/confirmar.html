<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirmacion de pago | PLOTEX Temuco</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .confirm-card {
    max-width: 520px;
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 44px 36px;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .confirm-icon {
    width: 68px; height: 68px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 1.9rem;
  }
  .confirm-icon.ok { background: rgba(255, 107, 53, 0.12); color: var(--orange); }
  .confirm-icon.fail { background: rgba(224, 78, 27, 0.1); color: var(--orange-2); }
  .confirm-title { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 10px; }
  .confirm-title em { font-style: italic; color: var(--primary); }
  .confirm-lead { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 28px; }
  .confirm-code {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600;
    background: var(--bg-2); border: 1px solid var(--border-strong);
    border-radius: var(--r-full); padding: 10px 20px; margin-bottom: 28px;
  }
  .confirm-actions { display: flex; flex-direction: column; gap: 12px; }
  .simulated-tag {
    margin-top: 20px; font-size: 0.78rem; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
</style>
</head>
<body>
  <div class="confirm-card">
    <div id="cIcon" class="confirm-icon ok"><i class="bi bi-check-lg"></i></div>
    <h1 class="confirm-title" id="cTitle">Pago <em>confirmado</em></h1>
    <p class="confirm-lead" id="cLead">Tu pedido fue recibido y ya esta en preparacion.</p>

    <div class="confirm-code" id="cCodeWrap" hidden>
      <i class="bi bi-upc-scan"></i>
      <span id="cCode">—</span>
    </div>

    <div class="confirm-actions">
      <a href="#" id="cTrackLink" class="btn btn-primary btn-lg btn-block">
        <i class="bi bi-box-seam"></i> Ver seguimiento del pedido
      </a>
      <a href="../index.html" class="btn btn-ghost btn-block">
        <i class="bi bi-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const tracking = params.get("tracking") || "";
  const ok = params.get("ok") === "1";
  const motivo = params.get("motivo") || "";

  const icon = document.getElementById("cIcon");
  const title = document.getElementById("cTitle");
  const lead = document.getElementById("cLead");
  const codeWrap = document.getElementById("cCodeWrap");
  const code = document.getElementById("cCode");
  const trackLink = document.getElementById("cTrackLink");

  const savedTheme = localStorage.getItem("plotex-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", savedTheme);

  const motivos = {
    anulado: "Anulaste el pago antes de terminar en Webpay.",
    sin_token: "No recibimos una confirmacion valida de Transbank.",
    no_encontrado: "No encontramos el pedido asociado a este pago.",
    error: "Ocurrio un error al confirmar el pago con Transbank.",
  };

  if (ok) {
    icon.className = "confirm-icon ok";
    icon.innerHTML = '<i class="bi bi-check-lg"></i>';
    title.innerHTML = 'Pago <em>confirmado</em>';
    lead.textContent = "Tu pedido fue recibido y ya esta en preparacion.";
  } else {
    icon.className = "confirm-icon fail";
    icon.innerHTML = '<i class="bi bi-x-lg"></i>';
    title.innerHTML = 'Pago <em>no procesado</em>';
    lead.textContent = motivos[motivo] || "No se pudo confirmar el pago. Intenta nuevamente o escribenos por WhatsApp.";
  }

  if (tracking) {
    codeWrap.hidden = false;
    code.textContent = tracking;
    trackLink.href = `../index.html?tracking=${encodeURIComponent(tracking)}#seguimiento`;
  } else {
    trackLink.href = "../index.html#seguimiento";
  }
})();
</script>
</body>
</html>
